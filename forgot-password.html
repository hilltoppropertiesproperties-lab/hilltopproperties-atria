<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - Hilltop Properties Zambia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="login.css" />
  <link rel="stylesheet" href="reset-password.css" />
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-brand-panel">
      <div class="login-brand">
        <div class="brand-icon">H</div>
        <div>
          <p class="login-kicker">Hilltop Properties Zambia</p>
          <h1>Admin Portal</h1>
        </div>
      </div>
      <p class="login-copy">Request a secure link to reset your Hilltop administrator password.</p>
    </section>

    <section class="login-card" aria-labelledby="forgotTitle">
      <div class="login-card-header">
        <h2 id="forgotTitle">Forgot Password?</h2>
        <p>Enter your admin email and we’ll send a password reset link.</p>
      </div>

      <form id="forgotPasswordForm" novalidate>
        <div class="login-error" id="forgotError" role="alert" aria-live="polite"></div>
        <div class="login-field">
          <label for="forgotEmail">Email address</label>
          <input type="email" id="forgotEmail" autocomplete="email" placeholder="admin@hilltopproperties.co.zm" required />
        </div>
        <button type="submit" class="login-submit" id="forgotSubmit">
          <span class="btn-label">Send reset link</span>
          <span class="btn-loading">Sending...</span>
        </button>
        <p class="auth-back"><a class="auth-back-link" href="login.html">Back to Admin Sign In</a></p>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="forgot-password.js"></script>
</body>
</html>
