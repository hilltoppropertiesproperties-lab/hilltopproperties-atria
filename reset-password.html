<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set New Password - Hilltop Properties Zambia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="login.css" />
  <link rel="stylesheet" href="reset-password.css" />
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-brand-panel">
      <div class="login-brand">
        <div class="brand-icon">H</div>
        <div>
          <p class="login-kicker">Hilltop Properties Zambia</p>
          <h1>Admin Portal</h1>
        </div>
      </div>
      <p class="login-copy">Choose a new password to securely regain access to your administrator portal.</p>
    </section>

    <section class="login-card" id="resetCard" aria-labelledby="resetTitle">
      <div class="login-card-header">
        <h2 id="resetTitle">Set New Password</h2>
        <p id="resetIntro">Enter and confirm your new administrator password.</p>
      </div>

      <div class="login-error" id="resetMessage" role="alert" aria-live="polite"></div>
      <form id="resetPasswordForm" novalidate hidden>
        <div class="login-field password-field">
          <label for="newPassword">New password</label>
          <div class="password-input-wrap">
            <input type="password" id="newPassword" autocomplete="new-password" minlength="8" required />
            <button type="button" class="password-toggle" data-target="newPassword" aria-label="Show new password">Show</button>
          </div>
          <small class="password-help">Use at least 8 characters.</small>
        </div>
        <div class="login-field password-field">
          <label for="confirmPassword">Confirm new password</label>
          <div class="password-input-wrap">
            <input type="password" id="confirmPassword" autocomplete="new-password" minlength="8" required />
            <button type="button" class="password-toggle" data-target="confirmPassword" aria-label="Show confirmed password">Show</button>
          </div>
        </div>
        <button type="submit" class="login-submit" id="resetSubmit">
          <span class="btn-label">Update password</span>
          <span class="btn-loading">Updating...</span>
        </button>
      </form>
      <p class="auth-back"><a class="auth-back-link" href="login.html">Back to Admin Sign In</a></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="reset-password.js"></script>
</body>
</html>
